# NodeGuard UEM – Server mit Datenbank
# Agent-Pakete kommen aus dem öffentlichen CDN (https://cdn-uem.backend.pcsmw.de).
# Anleitung: ../quick-start.md

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nodeguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD in der .env setzen}
      POSTGRES_DB: ${DB_DATABASE:-nodeguard}
    volumes:
      - ./pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nodeguard:
    image: docker.backend.pcsmw.de/nodeguard-server:${NODEGUARD_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-nodeguard}:${DB_PASSWORD:?DB_PASSWORD in der .env setzen}@db:5432/${DB_DATABASE:-nodeguard}"
      DATA_BASE_DIR: "/app/data"

      # Öffentlicher CDN für Agent-Pakete – nicht ändern.
      CDN_URL: "https://cdn-uem.backend.pcsmw.de"

      # Optional: eigenes Session-Secret (mind. 32 Zeichen).
      # Ohne Angabe wird eines erzeugt und in /app/data gespeichert.
      # SESSION_SECRET: "change-me-to-a-long-random-string"

      # Optional: Secure-Flag des Session-Cookies (auto | true | false).
      # Reines HTTP funktioniert mit dem Standard "auto".
      # SESSION_COOKIE_SECURE: "auto"
    volumes:
      # Enthält u. a. den CA-Schlüssel für Agent-Zertifikate – unbedingt sichern!
      - ./ng_data:/app/data
    ports:
      - "${NODEGUARD_PORT:-80}:80"
    depends_on:
      db:
        condition: service_healthy
